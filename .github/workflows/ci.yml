name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: task-engine tests
        run: node --test packages/task-engine/test/*.test.js
      - name: dsh-superbot tests
        run: node --test packages/dsh-superbot/test/*.test.js
      - name: package sanity (self-contained tarball)
        run: |
          cd packages/dsh-superbot
          npm pack --dry-run
          test -f lib/task-engine.js
